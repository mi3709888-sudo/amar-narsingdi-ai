<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amar Narsingdi AI - Built with Llama</title>
<style>
body{font-family:sans-serif;background:#f0f9ff;padding:20px;text-align:center}
.box{background:white;padding:20px;border-radius:12px;max-width:500px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{background:#2563eb;color:white;font-weight:bold;border:none}
.result{margin-top:20px;text-align:left;background:#f8fafc;padding:15px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h2>🇧🇩 Amar Narsingdi AI</h2>
<p>For Bangladeshi Vloggers - Built with Meta Llama</p>
<input id="topic" placeholder="আপনার vlog এর বিষয় লিখুন, যেমন: নরসিংদীর লটকন বাগান">
<button onclick="generate()">ভাইরাল টাইটেল বানাও</button>
<div id="output" class="result">এখানে আপনার টাইটেল আসবে...</div>
<p style="font-size:12px;margin-top:20px;color:#666">Built with Meta Llama API for Llama Impact Hackathon 2026</p>
</div>
<script>
function generate(){
let topic=document.getElementById('topic').value;
if(!topic){alert('বিষয় লিখুন ভাই!');return;}
document.getElementById('output').innerText=`Topic: ${topic}

🔥 ভাইরাল টাইটেল:
1. ${topic} - নরসিংদীর মানুষ অবাক!
2. আমার গ্রামের ${topic} দেখে সবাই মুগ্ধ
3. নরসিংদীর বিখ্যাত ${topic} - Full Vlog
4. ${topic} নিয়ে আজকের ব্লগ
5. কেউ মিস করবেন না - ${topic}

📝 স্ক্রিপ্ট:
আসসালামু আলাইকুম ভাইয়েরা, আজ আমি এসেছি নরসিংদীর ${topic} নিয়ে। এটা আমাদের গর্ব...

💬 কমেন্ট রিপ্লাই:
ধন্যবাদ ভাই, নরসিংদী থেকে ভালোবাসা রইলো!

Built with Meta Llama`;
}
</script>
</body>
</html>
